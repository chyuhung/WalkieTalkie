services:
  walkietalkie:
    build:
      context: .
      args:
        GOPROXY: https://goproxy.cn,https://goproxy.io,direct
    container_name: walkietalkie
    restart: unless-stopped
    ports:
      # 仅绑定本机回环，通过 Nginx HTTPS 反代访问（见 deploy/https/）
      # 若仍需局域网内 http://IP:8083 直连，可改回 "8083:8083"
      - "127.0.0.1:8083:8083"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  coturn:
    image: coturn/coturn
    container_name: coturn
    restart: unless-stopped
    # host 网络：TURN 需暴露大量 UDP 中继端口，host 模式免逐端口映射
    network_mode: host
    volumes:
      - ./deploy/turnserver.conf:/etc/turnserver.conf:ro
    command: ["-c", "/etc/turnserver.conf"]