<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1220">
  <title>网页对讲机</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app" class="hidden">
    <!-- 房间列表页 -->
    <section id="view-lobby" class="view">
      <header class="topbar">
        <h1>📻 对讲机</h1>
        <div class="topbar-actions">
          <button id="btn-my" class="icon-btn" title="我的">👤</button>
          <button id="btn-logout" class="icon-btn" title="退出登录">⏻</button>
        </div>
      </header>
      <div class="lobby-content">
        <div class="join-box">
          <input id="join-id" type="number" placeholder="输入房间 ID 直接加入" inputmode="numeric">
          <button id="btn-join-id" class="btn btn-primary">加入</button>
        </div>
        <div class="join-box">
          <input id="create-name" type="text" placeholder="新建房间名称" maxlength="30">
          <button id="btn-create" class="btn btn-success">新建房间</button>
        </div>
        <div class="room-list" id="room-list">
          <div class="loading">加载中…</div>
        </div>
        <div class="section-title">全部房间</div>
        <div class="room-list" id="all-rooms">
          <div class="loading">加载中…</div>
        </div>
      </div>
    </section>

    <!-- 对讲房间页 -->
    <section id="view-room" class="view hidden">
      <header class="topbar">
        <button id="btn-back" class="icon-btn" title="返回房间列表">←</button>
        <h1 id="room-title">房间</h1>
        <button id="btn-members" class="icon-btn" title="在线成员">👥 <span id="member-count" class="badge">0</span></button>
      </header>

      <!-- 在线成员列表 -->
      <div id="members-panel" class="members-panel hidden">
        <div class="members-header">
          <span>在线成员</span>
          <button id="btn-members-close" class="icon-btn">✕</button>
        </div>
        <ul id="members-list"></ul>
      </div>

      <div id="messages" class="messages"></div>

      <!-- 语音转文字开关提示 -->
      <div id="asr-hint" class="asr-hint hidden"></div>

      <div class="composer">
        <div class="composer-row">
          <button id="btn-voice-msg" class="btn btn-voice-msg" title="录制语音消息">🎤</button>
          <input id="text-input" type="text" placeholder="输入文字消息，回车发送（可自动朗读）" maxlength="1000">
          <button id="btn-send" class="btn btn-primary btn-send">发送</button>
        </div>
        <div class="composer-row ptt-row">
          <div class="ptt-wrap">
            <button id="btn-ptt" class="ptt-btn" disabled>按住说话</button>
            <div class="ptt-tip">按住 → 实时对讲 · 松开发送（WebRTC 直达）</div>
          </div>
        </div>
        <div class="composer-row settings-row">
          <label class="switch">
            <input type="checkbox" id="chk-tts" checked>
            <span>文字自动朗读</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="chk-asr" checked>
            <span>语音转文字显示</span>
          </label>
        </div>
      </div>
    </section>

    <!-- 录制语音弹窗 -->
    <div id="voice-rec-modal" class="modal hidden">
      <div class="modal-card">
        <h3>录制语音消息</h3>
        <div class="rec-status" id="rec-status">准备中…</div>
        <div class="rec-time" id="rec-time">0.0s</div>
        <div class="rec-actions">
          <button id="btn-rec-cancel" class="btn">取消</button>
          <button id="btn-rec-send" class="btn btn-primary" disabled>发送</button>
        </div>
      </div>
    </div>

    <!-- 成员信息弹窗 -->
    <div id="me-modal" class="modal hidden">
      <div class="modal-card">
        <h3>我的信息</h3>
        <div id="me-username"></div>
        <div id="me-id"></div>
        <button id="btn-me-close" class="btn btn-primary">关闭</button>
      </div>
    </div>
  </div>

  <script src="/static/webrtc.js"></script>
  <script src="/static/voice.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
