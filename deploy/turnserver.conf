# coturn TURN 中继配置（跨公网实时对讲必需）
# 用法见 README「TURN 部署」小节。
# 注意：把下方 <强密码> 替换为自定义密码，并与 config.yaml ice_servers 里的 credential 保持一致。
listening-port=3478
listening-ip=0.0.0.0
realm=walkietalkie
server-name=walkietalkie

# 长期凭据认证（静态用户名密码）
lt-cred-mech
user=walkie:<强密码>

fingerprint

# 中继端口段（需在安全组/防火墙放行该 UDP 段）
min-port=40000
max-port=41000

# 关闭 CLI 管理接口
no-cli
