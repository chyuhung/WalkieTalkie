# 自签 HTTPS 反代配置（无域名，iOS 网页版对讲）
#
# 用法：
#   1. 生成证书:  bash deploy/https/gen-certs.sh 8.134.203.172 192.168.1.100
#   2. 安装:      cp deploy/https/nginx-https.conf /etc/nginx/conf.d/walkietalkie.conf
#      （若上面脚本输出的证书装在 /etc/nginx/certs/，本配置无需改动）
#   3. 重载:      nginx -t && systemctl reload nginx
#   4. 安全组只开放 443，关闭公网 8083
#
# 注意：Docker 的 walkietalkie 需映射 127.0.0.1:8083（见 docker-compose）
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/walkielog.crt;
    ssl_certificate_key /etc/nginx/certs/walkielog.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 语音文件上限对应上传限制（5MB）
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}